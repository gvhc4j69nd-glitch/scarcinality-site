<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .cover{
    position:relative;width:1640px;height:624px;overflow:hidden;
    background:#f6f2e9;font-family:'EB Garamond',Georgia,serif;
  }

  /* ---- graph collage ---- */
  .collage{position:absolute;inset:0;}
  .collage img{
    position:absolute;background:#f6f2e9;
    border:1px solid #ddd3c2;
    box-shadow:0 6px 22px rgba(35,32,27,.10);
  }

  /* ---- blurred portrait, right side ---- */
  .portrait{
    position:absolute;top:0;right:-30px;width:600px;height:624px;
    overflow:visible;
  }
  /* soft parchment halo so charts do not read through his face */
  .portrait::before{
    content:"";position:absolute;left:26px;top:16px;width:560px;height:608px;
    background:radial-gradient(ellipse 46% 42% at 52% 46%,
      rgba(246,242,233,.96) 0%, rgba(246,242,233,.86) 44%,
      rgba(246,242,233,.42) 68%, rgba(246,242,233,0) 88%);
  }
  .portrait img{
    position:absolute;bottom:-34px;right:0;width:600px;height:600px;
    filter:blur(3.5px) grayscale(1) contrast(.86) brightness(1.09);
    opacity:.60;
  }
  /* soften where the portrait meets the type block */
  .portrait::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg, #f6f2e9 0%, rgba(246,242,233,.55) 30%,
               rgba(246,242,233,0) 62%);
  }

  /* ---- readability scrim behind the wordmark ---- */
  .scrim{
    position:absolute;top:0;left:0;width:1080px;height:624px;
    background:linear-gradient(90deg, rgba(246,242,233,.97) 0%, rgba(246,242,233,.94) 52%,
               rgba(246,242,233,.62) 78%, rgba(246,242,233,0) 100%);
  }

  /* ---- type block ---- */
  .type{
    position:absolute;left:96px;top:104px;
    width:820px;z-index:5;
  }
  .rule{width:78px;height:5px;background:#8a3324;margin-bottom:26px;}
  h1{
    font-size:104px;line-height:.95;margin:0 0 18px;font-weight:600;
    color:#211d18;letter-spacing:-1px;
  }
  .thesis{
    font-family:'EB Garamond',Georgia,serif;font-style:italic;
    font-size:37px;line-height:1.3;color:#5c5247;margin:0 0 24px;max-width:730px;
  }
  .foot{
    font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.24em;
    text-transform:uppercase;color:#8a8073;
  }
  .foot b{color:#8a3324;font-weight:500;}

  /* mobile-safe guide, removed before export */
  .guide{position:absolute;inset:0;z-index:99;display:none;}
  .guide .m{position:absolute;top:0;bottom:0;left:500px;width:640px;
    border-left:2px dashed #8a3324;border-right:2px dashed #8a3324;opacity:.5}
  .guide .p{position:absolute;left:48px;bottom:0;width:340px;height:170px;
    border:2px dashed #2f5670;border-radius:50%;opacity:.5}
</style></head>
<body>
<div class="cover">

  <div class="collage">
    <!-- back row, larger, lower opacity -->
    <img src="/assets/curiosity-energy-mix.svg"        style="left:812px; top:-26px;  width:430px; transform:rotate(-3.2deg); opacity:.50">
    <img src="/assets/curiosity-fiscal-map.svg"        style="left:1150px;top:22px;   width:380px; transform:rotate(2.4deg);  opacity:.26">
    <img src="/assets/curiosity-oil-timeline.svg"      style="left:1046px;top:300px;  width:420px; transform:rotate(1.6deg);  opacity:.46">
    <img src="/assets/curiosity-political-spectrum.svg" style="left:700px; top:352px;  width:390px; transform:rotate(-2.2deg); opacity:.40">

    <!-- front row, crisper -->
    <img src="/assets/curiosity-health-outcomes.svg"   style="left:706px; top:118px;  width:392px; transform:rotate(1.8deg);  opacity:.92">
    <img src="/assets/curiosity-rig-brent.svg"         style="left:1078px;top:96px;   width:372px; transform:rotate(-2.6deg); opacity:.88">
    <img src="/assets/curiosity-beef-chart.svg"        style="left:938px; top:352px;  width:360px; transform:rotate(2.8deg);  opacity:.86">
    <img src="/assets/curiosity-oil-cost.svg"          style="left:1300px;top:322px;  width:352px; transform:rotate(-1.4deg); opacity:.80">
    <img src="/assets/phaseplane.svg"                  style="left:1386px;top:64px;   width:290px; transform:rotate(3.4deg);  opacity:.20">
  </div>

  <div class="portrait">
    <img src="/assets/author-cutout.png" alt="">
  </div>

  <div class="scrim"></div>

  <div class="type">
    <div class="rule"></div>
    <h1>Scarcinality</h1>
    <p class="thesis">Scarcity is ordered. A shortage of money looks like a shortage of everything.</p>
    <p class="foot">The theory &middot; the dispatches &middot; the data &nbsp;&middot;&nbsp; <b>scarcinality.com</b></p>
  </div>

  <div class="guide"><div class="m"></div><div class="p"></div></div>
</div>


</body></html>
