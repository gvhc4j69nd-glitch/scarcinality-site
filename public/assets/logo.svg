<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Scarcinality</title>
  <desc id="d2">The Scarcinality logo: five stacked strata with the topmost fully oxblood, representing monetary scarcity at the top of the order, and progressively shorter oxblood segments below showing that scarcity descending into the layers it governs. Wordmark beneath.</desc>

  <rect width="512" height="512" fill="#f6f2e9"/>
  <rect x="26" y="26" width="460" height="460" fill="none" stroke="#211d18" stroke-width="2"/>

  <!-- the descent spine -->
  <line x1="106" y1="104" x2="106" y2="318" stroke="#8a3324" stroke-width="2.5"/>

  <!-- layer 1: money. entirely scarce. -->
  <rect x="106" y="104" width="300" height="26" fill="#8a3324"/>

  <!-- the counterfeit, weaker at each remove -->
  <rect x="106" y="156" width="300" height="26" fill="#ddd3c2"/>
  <rect x="106" y="156" width="232" height="26" fill="#8a3324"/>

  <rect x="106" y="208" width="300" height="26" fill="#ddd3c2"/>
  <rect x="106" y="208" width="164" height="26" fill="#8a3324"/>

  <rect x="106" y="260" width="300" height="26" fill="#ddd3c2"/>
  <rect x="106" y="260" width="97"  height="26" fill="#8a3324"/>

  <rect x="106" y="312" width="300" height="26" fill="#ddd3c2"/>
  <rect x="106" y="312" width="39"  height="26" fill="#8a3324"/>

  <!-- rule + wordmark -->
  <line x1="106" y1="382" x2="406" y2="382" stroke="#ddd3c2" stroke-width="1.5"/>
  <text x="256" y="424" text-anchor="middle"
        font-family="EB Garamond, Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="600" fill="#211d18" letter-spacing="1">Scarcinality</text>
  <text x="256" y="452" text-anchor="middle"
        font-family="IBM Plex Mono, ui-monospace, Menlo, monospace"
        font-size="13.5" fill="#8a8073" letter-spacing="3.4">WHICH SHORTAGE IS REAL</text>
</svg>
