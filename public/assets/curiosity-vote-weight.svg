  <text x="90" y="141" font-size="7.5" fill="#211d18" text-anchor="end">Senate seat</text>
  <line x1="118.8" y1="138" x2="293.5" y2="138" stroke="#ddd3c2" stroke-width="5" stroke-linecap="round"/>
