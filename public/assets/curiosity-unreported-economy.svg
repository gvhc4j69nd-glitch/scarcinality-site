<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <text x="14" y="18" font-size="7.5" fill="#8a8073">THE SAME COUNTRIES, TWO RANKINGS</text>

  <text x="14" y="38" font-size="7.5" fill="#8a3324">BY SHARE OF GDP</text>
  <text x="14" y="52" font-size="7" fill="#5c5247">Greece</text>
  <rect x="62" y="45" width="118" height="8" fill="#8a3324"/>
  <text x="184" y="52" font-size="7" fill="#5c5247">20.9%</text>
  <text x="14" y="66" font-size="7" fill="#5c5247">Italy</text>
  <rect x="62" y="59" width="115" height="8" fill="#8a3324"/>
  <text x="181" y="66" font-size="7" fill="#5c5247">20.3%</text>
  <text x="14" y="80" font-size="7" fill="#5c5247">United States</text>
  <rect x="62" y="73" width="34" height="8" fill="#8a3324" opacity="0.55"/>
  <text x="100" y="80" font-size="7" fill="#5c5247">6.1%</text>

  <line x1="14" y1="96" x2="306" y2="96" stroke="#ddd3c2" stroke-width="0.8"/>

  <text x="14" y="112" font-size="7.5" fill="#2f5670">BY AMOUNT</text>
  <text x="14" y="126" font-size="7" fill="#5c5247">United States</text>
  <rect x="62" y="119" width="200" height="8" fill="#2f5670"/>
  <text x="266" y="126" font-size="7" fill="#5c5247">$1.59tn</text>
  <text x="14" y="140" font-size="7" fill="#5c5247">Italy</text>
  <rect x="62" y="133" width="54" height="8" fill="#2f5670" opacity="0.55"/>
  <text x="120" y="140" font-size="7" fill="#5c5247">$427bn</text>
  <text x="14" y="154" font-size="7" fill="#5c5247">Greece</text>
  <rect x="62" y="147" width="6" height="8" fill="#2f5670" opacity="0.55"/>
  <text x="72" y="154" font-size="7" fill="#5c5247">$46bn</text>

  <line x1="14" y1="166" x2="306" y2="166" stroke="#ddd3c2" stroke-width="0.8"/>
  <text x="160" y="182" font-size="8" fill="#211d18" text-anchor="middle" font-weight="600">The ranking inverts</text>
  <text x="160" y="193" font-size="7" fill="#8a8073" text-anchor="middle">smallest share, largest amount</text>
</svg>
