<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <!-- axis ticks -->
  <line x1="72" y1="26" x2="72" y2="150" stroke="#ddd3c2" stroke-width="1"/>
  <line x1="130" y1="26" x2="130" y2="150" stroke="#ddd3c2" stroke-width="0.5"/>
  <line x1="188" y1="26" x2="188" y2="150" stroke="#ddd3c2" stroke-width="0.5"/>
  <line x1="246" y1="26" x2="246" y2="150" stroke="#ddd3c2" stroke-width="0.5"/>
  <text x="72"  y="22" font-size="6.5" fill="#8a8073" text-anchor="middle">0</text>
  <text x="130" y="22" font-size="6.5" fill="#8a8073" text-anchor="middle">3y</text>
  <text x="188" y="22" font-size="6.5" fill="#8a8073" text-anchor="middle">6y</text>
  <text x="246" y="22" font-size="6.5" fill="#8a8073" text-anchor="middle">9y</text>

  <!-- LAND row -->
  <text x="66" y="45" font-size="7.5" fill="#211d18" text-anchor="end" font-weight="600">Land</text>
  <rect x="72"  y="36" width="10" height="14" fill="#6b6a3a"/>
  <rect x="82"  y="36" width="8"  height="14" fill="#8a7a3d"/>
  <rect x="90"  y="36" width="3"  height="14" fill="#a8873f"/>
  <rect x="93"  y="36" width="2"  height="14" fill="#8a3324"/>
  <rect x="95"  y="36" width="3"  height="14" fill="#2f6b52"/>
  <text x="103" y="46" font-size="6.5" fill="#211d18">16 mo</text>

  <!-- SHALLOW row -->
  <text x="66" y="83" font-size="7.5" fill="#211d18" text-anchor="end" font-weight="600">Shallow</text>
  <rect x="72"  y="74" width="23" height="14" fill="#6b6a3a"/>
  <rect x="95"  y="74" width="19" height="14" fill="#8a7a3d"/>
  <rect x="114" y="74" width="8"  height="14" fill="#a8873f"/>
  <rect x="122" y="74" width="4"  height="14" fill="#8a3324"/>
  <rect x="126" y="74" width="19" height="14" fill="#6d4a6a"/>
  <rect x="145" y="74" width="24" height="14" fill="#3d5a6b"/>
  <rect x="169" y="74" width="10" height="14" fill="#2f6b52"/>
  <text x="184" y="84" font-size="6.5" fill="#211d18">5.5 yr</text>

  <!-- DEEP row -->
  <text x="66" y="121" font-size="7.5" fill="#211d18" text-anchor="end" font-weight="600">Deep</text>
  <rect x="72"  y="112" width="32" height="14" fill="#6b6a3a"/>
  <rect x="104" y="112" width="16" height="14" fill="#8a7a3d"/>
  <rect x="120" y="112" width="13" height="14" fill="#a8873f"/>
  <rect x="133" y="112" width="13" height="14" fill="#8a3324"/>
  <rect x="146" y="112" width="32" height="14" fill="#6d4a6a"/>
  <rect x="178" y="112" width="48" height="14" fill="#3d5a6b"/>
  <rect x="226" y="112" width="16" height="14" fill="#2f6b52"/>
  <text x="247" y="122" font-size="6.5" fill="#211d18">8.8 yr</text>

  <!-- success rate strip -->
  <line x1="20" y1="160" x2="300" y2="160" stroke="#ddd3c2" stroke-width="0.6"/>
  <text x="20" y="176" font-size="7.5" fill="#5c5247">Commercial success:</text>
  <rect x="122" y="168" width="42" height="9" fill="#ddd3c2" opacity=".4"/>
  <rect x="122" y="168" width="28" height="9" fill="#2f6b52"/>
  <text x="168" y="176" font-size="7" fill="#2f6b52">67% dev</text>
  <rect x="212" y="168" width="42" height="9" fill="#ddd3c2" opacity=".4"/>
  <rect x="212" y="168" width="2"  height="9" fill="#5a1f18"/>
  <text x="258" y="176" font-size="7" fill="#5a1f18">5% u-deep</text>
  <text x="20" y="192" font-size="6.8" fill="#8a8073">Survey to first oil, then wellhead to pump</text>
</svg>
