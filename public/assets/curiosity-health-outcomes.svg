<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <!-- axes -->
  <line x1="40" y1="26" x2="40" y2="150" stroke="#ddd3c2" stroke-width="1"/>
  <line x1="40" y1="150" x2="298" y2="150" stroke="#ddd3c2" stroke-width="1"/>
  <line x1="40" y1="119" x2="298" y2="119" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="40" y1="88"  x2="298" y2="88"  stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="40" y1="57"  x2="298" y2="57"  stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="105" y1="26" x2="105" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="170" y1="26" x2="170" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="235" y1="26" x2="235" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <text x="34" y="153" font-size="6" fill="#8a8073" text-anchor="end">1</text>
  <text x="34" y="60"  font-size="6" fill="#8a8073" text-anchor="end">4</text>
  <text x="40"  y="163" font-size="6" fill="#8a8073" text-anchor="middle">$4k</text>
  <text x="170" y="163" font-size="6" fill="#8a8073" text-anchor="middle">$9k</text>
  <text x="285" y="163" font-size="6" fill="#8a8073" text-anchor="middle">$14k</text>

  <!-- cluster of peer nations, low IMR across a wide spend range -->
  <circle cx="48"  cy="138" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="60"  cy="128" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="66"  cy="141" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="72"  cy="133" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="78"  cy="119" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="86"  cy="145" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="94"  cy="112" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="102" cy="126" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="112" cy="104" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="120" cy="130" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="132" cy="97"  r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="140" cy="122" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="152" cy="110" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="162" cy="95"  r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="174" cy="118" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="186" cy="101" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="196" cy="88"  r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="212" cy="106" r="3.4" fill="#3d5a6b" opacity=".82"/>
  <circle cx="228" cy="74"  r="3.4" fill="#3d5a6b" opacity=".82"/>
  <!-- Japan: cheap + best -->
  <circle cx="70" cy="150" r="4" fill="#3f7a4a"/>
  <text x="70" y="145" font-size="6" fill="#3f7a4a" text-anchor="middle">Japan</text>
  <!-- USA: most expensive + worst -->
  <circle cx="288" cy="35" r="7" fill="#8a3324" stroke="#f6f2e9" stroke-width="1.4"/>
  <text x="278" y="33" font-size="7.5" fill="#8a3324" text-anchor="end" font-weight="600">USA</text>

  <text x="40" y="20" font-size="6.4" fill="#8a8073">infant deaths / 1,000</text>
  <text x="298" y="20" font-size="6.4" fill="#8a8073" text-anchor="end">spending per person &#8594;</text>

  <line x1="14" y1="176" x2="306" y2="176" stroke="#ddd3c2" stroke-width="0.5"/>
  <text x="14" y="190" font-size="7" fill="#5c5247">Spends the most. Worst outcomes. 27 nations compared.</text>
</svg>
