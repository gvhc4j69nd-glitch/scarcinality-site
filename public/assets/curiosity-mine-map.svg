<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="360" fill="#f6f2e9"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="168" height="360" fill="#efe9db"/>
  <rect x="168" y="0" width="1" height="360" fill="#ddd3c2"/>

  <!-- sidebar labels -->
  <text x="16" y="28" font-size="8.5" fill="#8a8073" letter-spacing="1.4" font-family="monospace">COMMODITY</text>
  <rect x="16" y="35" width="136" height="22" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="1"/>
  <text x="24" y="51" font-size="10.5" fill="#211d18" font-family="monospace">Gold</text>

  <!-- stats card -->
  <rect x="12" y="68" width="144" height="80" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="1"/>
  <text x="20" y="82" font-size="8" fill="#8a8073" letter-spacing="1.2" font-family="monospace">OVERVIEW</text>
  <line x1="20" y1="87" x2="148" y2="87" stroke="#e7ddcd" stroke-width="1"/>
  <text x="20" y="101" font-size="9" fill="#8a8073" font-family="monospace">Total mines</text>
  <text x="148" y="101" font-size="9" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">169</text>
  <line x1="20" y1="107" x2="148" y2="107" stroke="#e7ddcd" stroke-width="0.7"/>
  <text x="20" y="121" font-size="9" fill="#8a8073" font-family="monospace">States with mines</text>
  <text x="148" y="121" font-size="9" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">14</text>
  <line x1="20" y1="127" x2="148" y2="127" stroke="#e7ddcd" stroke-width="0.7"/>
  <text x="20" y="141" font-size="9" fill="#8a8073" font-family="monospace">Top state</text>
  <text x="148" y="141" font-size="9" fill="#2b4a6f" font-weight="bold" text-anchor="end" font-family="monospace">Nevada</text>

  <!-- top states list -->
  <text x="16" y="162" font-size="8.5" fill="#8a8073" letter-spacing="1.2" font-family="monospace">TOP STATES</text>

  <rect x="12" y="167" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="180" font-size="8.5" fill="#8a8073" font-family="monospace">1</text>
  <circle cx="32" cy="176" r="4" fill="#2b4a6f"/>
  <text x="40" y="180" font-size="8.5" fill="#5c5247" font-family="monospace">Nevada</text>
  <text x="154" y="180" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">55</text>

  <rect x="12" y="188" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="201" font-size="8.5" fill="#8a8073" font-family="monospace">2</text>
  <circle cx="32" cy="197" r="4" fill="#324f6e"/>
  <text x="40" y="201" font-size="8.5" fill="#5c5247" font-family="monospace">Alaska</text>
  <text x="154" y="201" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">53</text>

  <rect x="12" y="209" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="222" font-size="8.5" fill="#8a8073" font-family="monospace">3</text>
  <circle cx="32" cy="218" r="4" fill="#3d6494"/>
  <text x="40" y="222" font-size="8.5" fill="#5c5247" font-family="monospace">Colorado</text>
  <text x="154" y="222" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">16</text>

  <!-- sub-header -->
  <rect x="169" y="0" width="471" height="26" fill="#efe9db"/>
  <rect x="169" y="26" width="471" height="1" fill="#ddd3c2"/>
  <rect x="175" y="5" width="16" height="16" fill="#2b4a6f"/>
  <text x="198" y="17" font-size="10" fill="#211d18" font-family="Georgia,serif" font-weight="600">Mine Count Map</text>
  <text x="628" y="17" font-size="7.5" fill="#8a8073" font-family="monospace" text-anchor="end">MSHA · arlweb.msha.gov</text>

  <!-- map blobs: gold mine distribution — NV/AK dominant, western states -->
  <g transform="translate(192,32)">
    <!-- Pacific NW - low/mid -->
    <ellipse cx="42"  cy="52"  rx="26" ry="22" fill="#c8d8e8"/>
    <ellipse cx="76"  cy="60"  rx="20" ry="18" fill="#d8e4ee"/>
    <ellipse cx="60"  cy="86"  rx="16" ry="13" fill="#d8e4ee"/>
    <!-- CA - mid -->
    <ellipse cx="30"  cy="116" rx="15" ry="28" fill="#a8c0d8"/>
    <!-- NEVADA - darkest -->
    <ellipse cx="58"  cy="110" rx="18" ry="20" fill="#2b4a6f"/>
    <!-- ALASKA inset -->
    <ellipse cx="100" cy="185" rx="28" ry="22" fill="#324f6e"/>
    <!-- Mountain / CO - dark -->
    <ellipse cx="134" cy="85"  rx="16" ry="18" fill="#3d6494"/>
    <ellipse cx="108" cy="105" rx="15" ry="13" fill="#8aaac8"/>
    <!-- AZ/NM - mid -->
    <ellipse cx="82"  cy="128" rx="18" ry="14" fill="#6a90b2"/>
    <!-- OR/ID - mid -->
    <ellipse cx="44"  cy="74"  rx="14" ry="12" fill="#8aaac8"/>
    <ellipse cx="84"  cy="70"  rx="12" ry="12" fill="#7a9ebc"/>
    <!-- MT - low -->
    <ellipse cx="130" cy="55"  rx="18" ry="14" fill="#a8c0d8"/>
    <!-- Plains/East - very light / no data -->
    <ellipse cx="200" cy="75"  rx="28" ry="20" fill="#eae4d5"/>
    <ellipse cx="240" cy="90"  rx="24" ry="18" fill="#eae4d5"/>
    <ellipse cx="220" cy="130" rx="22" ry="16" fill="#eae4d5"/>
    <ellipse cx="260" cy="55"  rx="20" ry="16" fill="#eae4d5"/>
    <ellipse cx="280" cy="120" rx="18" ry="20" fill="#eae4d5"/>
    <!-- SE slight color -->
    <ellipse cx="264" cy="158" rx="12" ry="18" fill="#e0dace"/>
  </g>

  <!-- grid lines -->
  <line x1="169" y1="130" x2="630" y2="130" stroke="#ddd3c2" stroke-width="0.5" opacity="0.5"/>
  <line x1="169" y1="170" x2="630" y2="170" stroke="#ddd3c2" stroke-width="0.5" opacity="0.5"/>
  <line x1="265" y1="27"  x2="265" y2="248" stroke="#ddd3c2" stroke-width="0.5" opacity="0.5"/>
  <line x1="375" y1="27"  x2="375" y2="248" stroke="#ddd3c2" stroke-width="0.5" opacity="0.5"/>
  <line x1="475" y1="27"  x2="475" y2="248" stroke="#ddd3c2" stroke-width="0.5" opacity="0.5"/>

  <!-- legend -->
  <line x1="169" y1="262" x2="630" y2="262" stroke="#ddd3c2" stroke-width="1"/>
  <defs>
    <linearGradient id="mineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#eae4d5"/>
      <stop offset="30%"  stop-color="#c8d8e8"/>
      <stop offset="60%"  stop-color="#6a90b2"/>
      <stop offset="80%"  stop-color="#3d6494"/>
      <stop offset="100%" stop-color="#2b4a6f"/>
    </linearGradient>
  </defs>
  <text x="175" y="280" font-size="8.5" fill="#8a8073" font-family="monospace">0</text>
  <rect x="192" y="270" width="280" height="10" fill="url(#mineGrad)" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="478" y="280" font-size="8.5" fill="#8a8073" font-family="monospace">55 mines</text>
  <text x="192" y="300" font-size="8" fill="#8a8073" font-family="monospace">Fewer mines</text>
  <text x="472" y="300" font-size="8" fill="#8a8073" font-family="monospace" text-anchor="end">More mines</text>
  <text x="618" y="344" font-size="8" fill="#8a8073" font-family="monospace" text-anchor="end">MSHA · Mine Registry</text>
</svg>
