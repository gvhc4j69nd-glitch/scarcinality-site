<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', monospace">
  <!-- dark map background -->
  <rect width="640" height="360" fill="#080e1a"/>
  <!-- sidebar strip -->
  <rect x="0" y="0" width="160" height="360" fill="#0f1a2e"/>
  <rect x="160" y="0" width="1" height="360" fill="#1e3050"/>

  <!-- sidebar labels -->
  <text x="16" y="30" font-size="9" fill="#6b82a8" letter-spacing="1.5" text-transform="uppercase">DISEASE</text>
  <rect x="16" y="38" width="128" height="22" rx="4" fill="#080e1a" stroke="#1e3050" stroke-width="1"/>
  <text x="24" y="54" font-size="10" fill="#8a9bb8">Chlamydia</text>

  <text x="16" y="82" font-size="9" fill="#6b82a8" letter-spacing="1.5">YEAR</text>
  <rect x="16" y="90" width="128" height="22" rx="4" fill="#080e1a" stroke="#1e3050" stroke-width="1"/>
  <text x="24" y="106" font-size="10" fill="#8a9bb8">2022</text>

  <!-- stats card -->
  <rect x="12" y="124" width="136" height="100" rx="6" fill="#080e1a" stroke="#1e3050" stroke-width="1"/>
  <text x="20" y="140" font-size="8" fill="#6b82a8" letter-spacing="1">OVERVIEW</text>
  <line x1="20" y1="146" x2="136" y2="146" stroke="#1e3050" stroke-width="1"/>
  <text x="20" y="160" font-size="9" fill="#6b82a8">Total cases</text>
  <text x="136" y="160" font-size="9" fill="#e2eaf8" text-anchor="end">1,645,809</text>
  <line x1="20" y1="166" x2="136" y2="166" stroke="#1e3050" stroke-width="0.5"/>
  <text x="20" y="180" font-size="9" fill="#6b82a8">States reporting</text>
  <text x="136" y="180" font-size="9" fill="#e2eaf8" text-anchor="end">50 / 50</text>
  <line x1="20" y1="186" x2="136" y2="186" stroke="#1e3050" stroke-width="0.5"/>
  <text x="20" y="200" font-size="9" fill="#6b82a8">Highest</text>
  <text x="136" y="200" font-size="9" fill="#f87171" text-anchor="end">California</text>

  <!-- top hotspots -->
  <text x="16" y="240" font-size="9" fill="#6b82a8" letter-spacing="1">TOP HOTSPOTS</text>
  <!-- hotspot items -->
  <rect x="12" y="248" width="136" height="18" rx="3" fill="#080e1a" stroke="#1e3050" stroke-width="0.5"/>
  <text x="22" y="261" font-size="8" fill="#6b82a8">1</text>
  <circle cx="32" cy="257" r="4" fill="#ef4444"/>
  <text x="40" y="261" font-size="8" fill="#c8d6f0">California</text>
  <text x="144" y="261" font-size="8" fill="#e2eaf8" text-anchor="end">224k</text>

  <rect x="12" y="270" width="136" height="18" rx="3" fill="#080e1a" stroke="#1e3050" stroke-width="0.5"/>
  <text x="22" y="283" font-size="8" fill="#6b82a8">2</text>
  <circle cx="32" cy="279" r="4" fill="#f97316"/>
  <text x="40" y="283" font-size="8" fill="#c8d6f0">Texas</text>
  <text x="144" y="283" font-size="8" fill="#e2eaf8" text-anchor="end">196k</text>

  <rect x="12" y="292" width="136" height="18" rx="3" fill="#080e1a" stroke="#1e3050" stroke-width="0.5"/>
  <text x="22" y="305" font-size="8" fill="#6b82a8">3</text>
  <circle cx="32" cy="301" r="4" fill="#fb923c"/>
  <text x="40" y="305" font-size="8" fill="#c8d6f0">Florida</text>
  <text x="144" y="305" font-size="8" fill="#e2eaf8" text-anchor="end">142k</text>

  <!-- simplified US map outlines as blobs -->
  <!-- Continental US rough outline -->
  <g transform="translate(185,30)">
    <!-- state fill shapes — stylized blobs in RdYlBu palette -->
    <!-- NW states (low - blue) -->
    <ellipse cx="60" cy="80" rx="32" ry="28" fill="#4575b4" opacity="0.85"/>
    <ellipse cx="100" cy="90" rx="24" ry="22" fill="#74add1" opacity="0.85"/>
    <ellipse cx="78" cy="122" rx="20" ry="16" fill="#5a9cc5" opacity="0.85"/>
    <!-- Mountain states (low-mid) -->
    <ellipse cx="140" cy="88" rx="22" ry="20" fill="#abd9e9" opacity="0.85"/>
    <ellipse cx="165" cy="110" rx="20" ry="22" fill="#e0f3f8" opacity="0.85"/>
    <ellipse cx="140" cy="130" rx="18" ry="16" fill="#fee090" opacity="0.85"/>
    <!-- SW (medium - yellow) -->
    <ellipse cx="110" cy="148" rx="22" ry="18" fill="#fdae61" opacity="0.85"/>
    <ellipse cx="90" cy="170" rx="16" ry="14" fill="#f46d43" opacity="0.85"/>
    <!-- Plains (low) -->
    <ellipse cx="195" cy="90" rx="22" ry="20" fill="#e0f3f8" opacity="0.85"/>
    <ellipse cx="220" cy="108" rx="20" ry="18" fill="#fee090" opacity="0.85"/>
    <ellipse cx="195" cy="128" rx="20" ry="16" fill="#fdae61" opacity="0.85"/>
    <!-- Midwest (med) -->
    <ellipse cx="258" cy="80" rx="26" ry="20" fill="#fee090" opacity="0.85"/>
    <ellipse cx="282" cy="100" rx="22" ry="20" fill="#fdae61" opacity="0.85"/>
    <ellipse cx="258" cy="118" rx="22" ry="16" fill="#f46d43" opacity="0.85"/>
    <!-- South (high - red) -->
    <ellipse cx="240" cy="155" rx="28" ry="18" fill="#d73027" opacity="0.85"/>
    <ellipse cx="270" cy="168" rx="22" ry="16" fill="#ef4444" opacity="0.85"/>
    <!-- TX (high) -->
    <ellipse cx="208" cy="165" rx="22" ry="22" fill="#e53e2b" opacity="0.85"/>
    <!-- NE (high) -->
    <ellipse cx="330" cy="68" rx="22" ry="18" fill="#ef4444" opacity="0.85"/>
    <ellipse cx="355" cy="85" rx="18" ry="16" fill="#f46d43" opacity="0.85"/>
    <!-- SE coast (high) -->
    <ellipse cx="312" cy="140" rx="20" ry="18" fill="#ef4444" opacity="0.85"/>
    <ellipse cx="330" cy="162" rx="16" ry="20" fill="#fdae61" opacity="0.85"/>
    <!-- FL -->
    <ellipse cx="310" cy="188" rx="14" ry="22" fill="#fdae61" opacity="0.85"/>
    <!-- CA (highest) -->
    <ellipse cx="42" cy="118" rx="18" ry="30" fill="#a50026" opacity="0.9"/>

    <!-- state borders overlay (faint) -->
    <line x1="0" y1="70" x2="380" y2="70" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="0" y1="108" x2="380" y2="108" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="0" y1="140" x2="380" y2="140" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="90" y1="40" x2="90" y2="200" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="170" y1="40" x2="170" y2="200" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="250" y1="40" x2="250" y2="200" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
    <line x1="320" y1="40" x2="320" y2="200" stroke="#1a2f50" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- legend bar at bottom -->
  <rect x="185" y="278" width="440" height="1" fill="#1e3050"/>
  <text x="185" y="298" font-size="9" fill="#6b82a8">0</text>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4575b4"/>
      <stop offset="25%" stop-color="#abd9e9"/>
      <stop offset="50%" stop-color="#ffffbf"/>
      <stop offset="75%" stop-color="#fdae61"/>
      <stop offset="100%" stop-color="#a50026"/>
    </linearGradient>
  </defs>
  <rect x="200" y="288" width="280" height="10" rx="3" fill="url(#lg)"/>
  <text x="488" y="298" font-size="9" fill="#6b82a8" text-anchor="end">224,320</text>
  <text x="200" y="316" font-size="8" fill="#3d5478">Fewer cases</text>
  <text x="488" y="316" font-size="8" fill="#3d5478" text-anchor="end">More cases</text>

  <!-- CDC badge -->
  <text x="610" y="338" font-size="8" fill="#3d5478" text-anchor="end">CDC · NNDSS</text>
</svg>
