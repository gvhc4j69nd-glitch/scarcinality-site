<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="360" fill="#f6f2e9"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="168" height="360" fill="#efe9db"/>
  <rect x="168" y="0" width="1" height="360" fill="#ddd3c2"/>

  <!-- sidebar labels -->
  <text x="16" y="28" font-size="8.5" fill="#8a8073" letter-spacing="1.4" font-family="monospace">DISEASE</text>
  <rect x="16" y="35" width="136" height="22" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="1"/>
  <text x="24" y="51" font-size="10.5" fill="#211d18" font-family="monospace">Chlamydia trachomatis</text>

  <text x="16" y="76" font-size="8.5" fill="#8a8073" letter-spacing="1.4" font-family="monospace">YEAR</text>
  <rect x="16" y="83" width="136" height="22" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="1"/>
  <text x="24" y="99" font-size="10.5" fill="#211d18" font-family="monospace">2022</text>

  <!-- stats card -->
  <rect x="12" y="118" width="144" height="108" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="1"/>
  <text x="20" y="134" font-size="8" fill="#8a8073" letter-spacing="1.2" font-family="monospace">OVERVIEW</text>
  <line x1="20" y1="140" x2="148" y2="140" stroke="#e7ddcd" stroke-width="1"/>
  <text x="20" y="155" font-size="9" fill="#8a8073" font-family="monospace">Total cases</text>
  <text x="148" y="155" font-size="9" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">596,556</text>
  <line x1="20" y1="161" x2="148" y2="161" stroke="#e7ddcd" stroke-width="0.7"/>
  <text x="20" y="176" font-size="9" fill="#8a8073" font-family="monospace">States reporting</text>
  <text x="148" y="176" font-size="9" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">48 / 51</text>
  <line x1="20" y1="182" x2="148" y2="182" stroke="#e7ddcd" stroke-width="0.7"/>
  <text x="20" y="197" font-size="9" fill="#8a8073" font-family="monospace">Highest</text>
  <text x="148" y="197" font-size="9" fill="#8a3324" font-weight="bold" text-anchor="end" font-family="monospace">California</text>
  <line x1="20" y1="203" x2="148" y2="203" stroke="#e7ddcd" stroke-width="0.7"/>
  <text x="20" y="218" font-size="9" fill="#8a8073" font-family="monospace">Lowest</text>
  <text x="148" y="218" font-size="9" fill="#5c5247" font-weight="bold" text-anchor="end" font-family="monospace">N. Dakota</text>

  <!-- top hotspots label -->
  <text x="16" y="244" font-size="8.5" fill="#8a8073" letter-spacing="1.2" font-family="monospace">TOP HOTSPOTS</text>
  <!-- items -->
  <rect x="12" y="250" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="263" font-size="8.5" fill="#8a8073" font-family="monospace">1</text>
  <circle cx="32" cy="259" r="4" fill="#8a3324"/>
  <text x="40" y="263" font-size="8.5" fill="#5c5247" font-family="monospace">California</text>
  <text x="154" y="263" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">80,407</text>

  <rect x="12" y="271" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="284" font-size="8.5" fill="#8a8073" font-family="monospace">2</text>
  <circle cx="32" cy="280" r="4" fill="#9e3d2e"/>
  <text x="40" y="284" font-size="8.5" fill="#5c5247" font-family="monospace">Florida</text>
  <text x="154" y="284" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">67,237</text>

  <rect x="12" y="292" width="144" height="18" fill="#f6f2e9" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="22" y="305" font-size="8.5" fill="#8a8073" font-family="monospace">3</text>
  <circle cx="32" cy="301" r="4" fill="#b54a38"/>
  <text x="40" y="305" font-size="8.5" fill="#5c5247" font-family="monospace">New York</text>
  <text x="154" y="305" font-size="8.5" fill="#211d18" font-weight="bold" text-anchor="end" font-family="monospace">53,300</text>

  <!-- map area -->
  <!-- sequential parchment→oxblood state blobs approximating the US -->
  <g transform="translate(192,28)">
    <!-- Pacific NW - low/mid -->
    <ellipse cx="42"  cy="52"  rx="28" ry="24" fill="#dbbfa0"/>
    <ellipse cx="76"  cy="60"  rx="22" ry="20" fill="#d4b494"/>
    <ellipse cx="60"  cy="88"  rx="18" ry="15" fill="#cba882"/>
    <!-- CA - highest -->
    <ellipse cx="30"  cy="118" rx="16" ry="30" fill="#8a3324"/>
    <!-- Mountain -->
    <ellipse cx="108" cy="65"  rx="20" ry="18" fill="#e8c9a8"/>
    <ellipse cx="132" cy="85"  rx="18" ry="20" fill="#e2bfa0"/>
    <ellipse cx="108" cy="106" rx="17" ry="15" fill="#d4b494"/>
    <!-- SW -->
    <ellipse cx="82"  cy="130" rx="20" ry="16" fill="#c9a07a"/>
    <ellipse cx="72"  cy="154" rx="14" ry="13" fill="#c09070"/>
    <!-- Plains -->
    <ellipse cx="162" cy="60"  rx="20" ry="18" fill="#e8c9a8"/>
    <ellipse cx="186" cy="76"  rx="18" ry="16" fill="#e2bfa0"/>
    <ellipse cx="164" cy="96"  rx="18" ry="14" fill="#dbbfa0"/>
    <!-- Midwest -->
    <ellipse cx="218" cy="55"  rx="22" ry="18" fill="#d4b494"/>
    <ellipse cx="240" cy="74"  rx="20" ry="18" fill="#c9a07a"/>
    <ellipse cx="216" cy="96"  rx="18" ry="14" fill="#c09070"/>
    <!-- South -->
    <ellipse cx="200" cy="132" rx="24" ry="16" fill="#b0604a"/>
    <ellipse cx="226" cy="148" rx="18" ry="14" fill="#a84a38"/>
    <!-- TX -->
    <ellipse cx="174" cy="148" rx="20" ry="20" fill="#9e3d2e"/>
    <!-- Northeast - high -->
    <ellipse cx="286" cy="44"  rx="20" ry="16" fill="#9e3d2e"/>
    <ellipse cx="308" cy="60"  rx="16" ry="14" fill="#b54a38"/>
    <!-- SE Coast -->
    <ellipse cx="268" cy="118" rx="18" ry="16" fill="#a84a38"/>
    <!-- FL -->
    <ellipse cx="264" cy="160" rx="12" ry="20" fill="#9e3d2e"/>
  </g>

  <!-- state border grid (faint) -->
  <line x1="169" y1="120" x2="630" y2="120" stroke="#ddd3c2" stroke-width="0.5" opacity="0.6"/>
  <line x1="169" y1="160" x2="630" y2="160" stroke="#ddd3c2" stroke-width="0.5" opacity="0.6"/>
  <line x1="260" y1="28"  x2="260" y2="240" stroke="#ddd3c2" stroke-width="0.5" opacity="0.6"/>
  <line x1="370" y1="28"  x2="370" y2="240" stroke="#ddd3c2" stroke-width="0.5" opacity="0.6"/>
  <line x1="470" y1="28"  x2="470" y2="240" stroke="#ddd3c2" stroke-width="0.5" opacity="0.6"/>

  <!-- legend bar -->
  <line x1="169" y1="260" x2="630" y2="260" stroke="#ddd3c2" stroke-width="1"/>
  <text x="175" y="278" font-size="8.5" fill="#8a8073" font-family="monospace">0</text>

  <defs>
    <linearGradient id="oxGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0e4d0"/>
      <stop offset="30%"  stop-color="#dbbfa0"/>
      <stop offset="60%"  stop-color="#c09070"/>
      <stop offset="80%"  stop-color="#a84a38"/>
      <stop offset="100%" stop-color="#8a3324"/>
    </linearGradient>
  </defs>
  <rect x="192" y="268" width="280" height="10" fill="url(#oxGrad)" stroke="#ddd3c2" stroke-width="0.7"/>
  <text x="478" y="278" font-size="8.5" fill="#8a8073" font-family="monospace">80,407</text>

  <text x="192" y="296" font-size="8" fill="#8a8073" font-family="monospace">Fewer cases</text>
  <text x="472" y="296" font-size="8" fill="#8a8073" font-family="monospace" text-anchor="end">More cases</text>

  <text x="175" y="278" font-size="8.5" fill="#8a8073" font-family="monospace">0</text>
  <text x="616" y="340" font-size="8" fill="#8a8073" font-family="monospace" text-anchor="end">CDC · NNDSS</text>

  <!-- sub-header strip at top -->
  <rect x="169" y="0" width="471" height="24" fill="#efe9db"/>
  <rect x="169" y="24" width="471" height="1" fill="#ddd3c2"/>
  <rect x="175" y="4" width="16" height="16" fill="#8a3324"/>
  <text x="198" y="16" font-size="9.5" fill="#211d18" font-family="Georgia, serif" font-weight="600">Disease Hotspot Map</text>
  <text x="576" y="15" font-size="7.5" fill="#8a8073" font-family="monospace" text-anchor="end">CDC · data.cdc.gov</text>
</svg>
