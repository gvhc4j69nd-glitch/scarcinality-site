<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <text x="14" y="18" font-size="7.5" fill="#8a8073">CORN, ONE ACRE, 2026</text>

  <text x="14" y="38" font-size="7.5" fill="#7a5a18">2026 INPUT COST RISE</text>
  <rect x="14" y="44" width="70.1" height="14" fill="#7a5a18"/>
  <rect x="84.1" y="44" width="124.2" height="14" fill="#2f5670"/>
  <text x="212" y="54" font-size="7.5" fill="#5c5247">$42.23</text>

  <text x="14" y="76" font-size="7.5" fill="#8a3324">BRIDGE ASSISTANCE PAYMENT</text>
  <rect x="14" y="82" width="204.1" height="14" fill="#8a3324"/>
  <text x="222" y="92" font-size="7.5" fill="#5c5247">$44.36</text>

  <line x1="14" y1="108" x2="306" y2="108" stroke="#ddd3c2" stroke-width="0.8"/>

  <text x="160" y="130" font-size="13" fill="#211d18" text-anchor="middle" font-weight="600">$42 of cost, $44 of check</text>
  <text x="160" y="148" font-size="7.5" fill="#8a8073" text-anchor="middle">diesel drove it, and diesel is not a tariff</text>
  <text x="160" y="164" font-size="7.5" fill="#7a5a18" text-anchor="middle">potash is tariff-exempt, about $0.80 an acre</text>
  <text x="160" y="182" font-size="7.5" fill="#2f5670" text-anchor="middle">soybeans get 2.5 times their cost rise</text>
</svg>
