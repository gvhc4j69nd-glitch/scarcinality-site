<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <!-- x grid -->
  <line x1="82" y1="26" x2="82" y2="150" stroke="#ddd3c2" stroke-width="1"/>
  <line x1="130" y1="26" x2="130" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="178" y1="26" x2="178" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="226" y1="26" x2="226" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="274" y1="26" x2="274" y2="150" stroke="#ddd3c2" stroke-width="0.4"/>
  <text x="82"  y="162" font-size="6.5" fill="#8a8073" text-anchor="middle">$0</text>
  <text x="130" y="162" font-size="6.5" fill="#8a8073" text-anchor="middle">$35</text>
  <text x="178" y="162" font-size="6.5" fill="#8a8073" text-anchor="middle">$70</text>
  <text x="226" y="162" font-size="6.5" fill="#8a8073" text-anchor="middle">$105</text>
  <text x="274" y="162" font-size="6.5" fill="#8a8073" text-anchor="middle">$140</text>

  <!-- Brent reference -->
  <line x1="178" y1="20" x2="178" y2="150" stroke="#211d18" stroke-width="1.1" stroke-dasharray="4 3" opacity=".75"/>
  <text x="182" y="18" font-size="6" fill="#211d18">Brent</text>

  <!-- Algeria -->
  <text x="76" y="40" font-size="7" fill="#211d18" text-anchor="end" font-weight="600">Algeria</text>
  <line x1="102" y1="37" x2="260" y2="37" stroke="#8a8073" stroke-width="1" opacity=".45"/>
  <circle cx="102" cy="37" r="4" fill="#2f6b52" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="137" cy="37" r="4" fill="#a8873f" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="260" cy="37" r="4.5" fill="#8a3324" stroke="#f6f2e9" stroke-width="1"/>

  <!-- Nigeria -->
  <text x="76" y="62" font-size="7" fill="#211d18" text-anchor="end" font-weight="600">Nigeria</text>
  <line x1="116" y1="59" x2="253" y2="59" stroke="#8a8073" stroke-width="1" opacity=".45"/>
  <circle cx="116" cy="59" r="4" fill="#2f6b52" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="140" cy="59" r="4" fill="#a8873f" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="253" cy="59" r="4.5" fill="#8a3324" stroke="#f6f2e9" stroke-width="1"/>

  <!-- Iraq -->
  <text x="76" y="84" font-size="7" fill="#211d18" text-anchor="end" font-weight="600">Iraq</text>
  <line x1="96" y1="81" x2="216" y2="81" stroke="#8a8073" stroke-width="1" opacity=".45"/>
  <circle cx="96" cy="81" r="4" fill="#2f6b52" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="123" cy="81" r="4" fill="#a8873f" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="216" cy="81" r="4.5" fill="#8a3324" stroke="#f6f2e9" stroke-width="1"/>

  <!-- Russia -->
  <text x="76" y="106" font-size="7" fill="#211d18" text-anchor="end" font-weight="600">Russia</text>
  <line x1="107" y1="103" x2="212" y2="103" stroke="#8a8073" stroke-width="1" opacity=".45"/>
  <circle cx="107" cy="103" r="4" fill="#2f6b52" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="144" cy="103" r="4" fill="#a8873f" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="212" cy="103" r="4.5" fill="#8a3324" stroke="#f6f2e9" stroke-width="1"/>

  <!-- Saudi Arabia — the headline row -->
  <text x="76" y="128" font-size="7" fill="#211d18" text-anchor="end" font-weight="600">Saudi</text>
  <line x1="86" y1="125" x2="200" y2="125" stroke="#8a3324" stroke-width="1.3" opacity=".6"/>
  <circle cx="86" cy="125" r="4.5" fill="#2f6b52" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="119" cy="125" r="4" fill="#a8873f" stroke="#f6f2e9" stroke-width="1"/>
  <circle cx="200" cy="125" r="5" fill="#8a3324" stroke="#f6f2e9" stroke-width="1"/>
  <text x="86" y="140" font-size="5.8" fill="#2f6b52" text-anchor="middle">$3</text>
  <text x="200" y="140" font-size="5.8" fill="#8a3324" text-anchor="middle">$86</text>

  <!-- legend -->
  <circle cx="24" cy="181" r="4" fill="#2f6b52"/>
  <text x="32" y="184" font-size="6.4" fill="#5c5247">Lifting</text>
  <circle cx="82" cy="181" r="4" fill="#a8873f"/>
  <text x="90" y="184" font-size="6.4" fill="#5c5247">Full-cycle</text>
  <circle cx="156" cy="181" r="4" fill="#8a3324"/>
  <text x="164" y="184" font-size="6.4" fill="#5c5247">Fiscal breakeven</text>
</svg>
