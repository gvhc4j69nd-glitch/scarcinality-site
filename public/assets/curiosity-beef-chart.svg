<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <!-- grid -->
  <line x1="38" y1="20" x2="38" y2="158" stroke="#ddd3c2" stroke-width="0.8"/>
  <line x1="38" y1="158" x2="296" y2="158" stroke="#ddd3c2" stroke-width="0.8"/>
  <line x1="38" y1="55"  x2="296" y2="55"  stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="38" y1="88"  x2="296" y2="88"  stroke="#ddd3c2" stroke-width="0.4"/>
  <line x1="38" y1="122" x2="296" y2="122" stroke="#ddd3c2" stroke-width="0.4"/>
  <!-- y labels -->
  <text x="32" y="59"  font-size="7" fill="#8a8073" text-anchor="end">$6</text>
  <text x="32" y="92"  font-size="7" fill="#8a8073" text-anchor="end">$5</text>
  <text x="32" y="126" font-size="7" fill="#8a8073" text-anchor="end">$4</text>
  <text x="32" y="159" font-size="7" fill="#8a8073" text-anchor="end">$3</text>
  <!-- event verticals -->
  <line x1="97"  y1="20" x2="97"  y2="158" stroke="#2f5670"  stroke-width="0.9" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="167" y1="20" x2="167" y2="158" stroke="#7a5a18"  stroke-width="0.9" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="230" y1="20" x2="230" y2="158" stroke="#8a3324"  stroke-width="0.9" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- price line: 2008($3.04)→2011($3.46)→2015($4.63)→2019($4.23)→2020($4.63)→2022($5.31)→2025($6.09)→2026($6.78) -->
  <!-- scale: y = 158 - (price-3)/(7.5-3)*138  at x spread over 38-296 (258px for 18 intervals) -->
  <!-- x step = 258/18 = 14.33 per year, 2008=38 -->
  <!-- 2008: x=38,  y=158-(3.04-3)/4.5*138 = 158-1.23=156.8 -->
  <!-- 2009: x=52,  y=158-(3.10-3)/4.5*138 = 158-3.07=154.9 -->
  <!-- 2010: x=67,  y=158-(3.18-3)/4.5*138 = 158-5.52=152.5 -->
  <!-- 2011: x=81,  y=158-(3.46-3)/4.5*138 = 158-14.1=143.9 -->
  <!-- 2012: x=95,  y=158-(3.72-3)/4.5*138 = 158-22.1=135.9 -->
  <!-- 2013: x=109, y=158-(3.82-3)/4.5*138 = 158-25.2=132.8 -->
  <!-- 2014: x=124, y=158-(4.30-3)/4.5*138 = 158-39.9=118.1 -->
  <!-- 2015: x=138, y=158-(4.63-3)/4.5*138 = 158-50.0=108.0 -->
  <!-- 2016: x=152, y=158-(4.25-3)/4.5*138 = 158-38.3=119.7 -->
  <!-- 2017: x=167, y=158-(4.12-3)/4.5*138 = 158-34.3=123.7 -->
  <!-- 2018: x=181, y=158-(4.12-3)/4.5*138 = 123.7 -->
  <!-- 2019: x=195, y=158-(4.23-3)/4.5*138 = 158-37.7=120.3 -->
  <!-- 2020: x=209, y=158-(4.63-3)/4.5*138 = 108.0 -->
  <!-- 2021: x=224, y=158-(4.88-3)/4.5*138 = 158-57.7=100.3 -->
  <!-- 2022: x=238, y=158-(5.31-3)/4.5*138 = 158-70.8=87.2 -->
  <!-- 2023: x=252, y=158-(5.43-3)/4.5*138 = 158-74.4=83.6 -->
  <!-- 2024: x=267, y=158-(5.48-3)/4.5*138 = 158-76.0=82.0 -->
  <!-- 2025: x=281, y=158-(6.09-3)/4.5*138 = 158-94.8=63.2 -->
  <!-- 2026: x=296, y=158-(6.78-3)/4.5*138 = 158-116.0=42.0 -->
  <polyline
    points="38,157 52,155 67,152 81,144 95,136 109,133 124,118 138,108 152,120 167,124 181,124 195,120 209,108 224,100 238,87 252,84 267,82 281,63 296,42"
    fill="none" stroke="#8a3324" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- event dots -->
  <circle cx="81"  cy="144" r="4" fill="#2f5670"  stroke="#f6f2e9" stroke-width="1.2"/>
  <circle cx="167" cy="124" r="4" fill="#7a5a18"  stroke="#f6f2e9" stroke-width="1.2"/>
  <circle cx="230" cy="87"  r="4" fill="#8a3324"  stroke="#f6f2e9" stroke-width="1.2"/>
  <!-- event labels -->
  <text x="99"  y="31" font-size="7" fill="#2f5670">Drought</text>
  <text x="169" y="31" font-size="7" fill="#7a5a18">COVID</text>
  <text x="232" y="31" font-size="7" fill="#8a3324">Tariffs</text>
  <!-- x axis labels -->
  <text x="38"  y="171" font-size="7" fill="#8a8073" text-anchor="middle">2008</text>
  <text x="138" y="171" font-size="7" fill="#8a8073" text-anchor="middle">2015</text>
  <text x="209" y="171" font-size="7" fill="#8a8073" text-anchor="middle">2020</text>
  <text x="296" y="171" font-size="7" fill="#8a8073" text-anchor="middle">2026</text>
  <!-- legend -->
  <line x1="38" y1="185" x2="52" y2="185" stroke="#8a3324" stroke-width="2"/>
  <text x="56" y="188" font-size="7" fill="#5c5247">Ground beef avg retail $/lb</text>
</svg>
