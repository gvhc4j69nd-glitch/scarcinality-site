<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <!-- party bands (approx eras scaled 1940-2026 over x 30-300) -->
  <rect x="30"  y="20" width="41" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="71"  y="20" width="25" height="140" fill="rgba(138,51,36,.12)"/>
  <rect x="96"  y="20" width="25" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="121" y="20" width="25" height="140" fill="rgba(138,51,36,.12)"/>
  <rect x="146" y="20" width="13" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="159" y="20" width="37" height="140" fill="rgba(138,51,36,.12)"/>
  <rect x="196" y="20" width="25" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="221" y="20" width="25" height="140" fill="rgba(138,51,36,.12)"/>
  <rect x="246" y="20" width="25" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="271" y="20" width="13" height="140" fill="rgba(138,51,36,.12)"/>
  <rect x="284" y="20" width="10" height="140" fill="rgba(47,86,112,.14)"/>
  <rect x="294" y="20" width="6"  height="140" fill="rgba(138,51,36,.12)"/>
  <!-- baseline -->
  <line x1="30" y1="160" x2="300" y2="160" stroke="#ddd3c2" stroke-width="1"/>
  <line x1="30" y1="120" x2="300" y2="120" stroke="#ddd3c2" stroke-width="0.5"/>
  <!-- unemployment (navy) -->
  <polyline points="30,55 45,140 60,135 75,130 90,115 105,130 120,100 135,105 150,110 165,90 180,120 195,125 210,130 225,135 240,95 255,130 270,140 285,132 300,130"
    fill="none" stroke="#2f5670" stroke-width="1.8"/>
  <!-- inflation (oxblood) -->
  <polyline points="30,155 40,105 55,130 70,150 85,148 100,145 115,135 130,100 145,80 160,130 175,138 190,142 205,145 220,140 235,150 250,153 265,118 280,140 300,135"
    fill="none" stroke="#8a3324" stroke-width="1.5"/>
  <!-- debt/GDP (gray dashed) -->
  <polyline points="30,110 45,42 60,70 75,88 90,105 105,118 120,125 135,120 150,112 165,102 180,95 195,98 210,95 225,90 240,60 255,42 270,38 285,35 300,32"
    fill="none" stroke="#5c5247" stroke-width="1.6" stroke-dasharray="5 3"/>
  <!-- labels -->
  <text x="30"  y="176" font-size="7" fill="#8a8073" text-anchor="middle">1940</text>
  <text x="165" y="176" font-size="7" fill="#8a8073" text-anchor="middle">1983</text>
  <text x="300" y="176" font-size="7" fill="#8a8073" text-anchor="middle">2026</text>
  <line x1="30" y1="190" x2="44" y2="190" stroke="#2f5670" stroke-width="2"/>
  <text x="48" y="193" font-size="7" fill="#5c5247">Unemp</text>
  <line x1="92" y1="190" x2="106" y2="190" stroke="#8a3324" stroke-width="2"/>
  <text x="110" y="193" font-size="7" fill="#5c5247">Inflation</text>
  <line x1="168" y1="190" x2="182" y2="190" stroke="#5c5247" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="186" y="193" font-size="7" fill="#5c5247">Debt/GDP</text>
</svg>
