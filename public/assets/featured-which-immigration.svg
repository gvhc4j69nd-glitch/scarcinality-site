<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="320" height="200" fill="#f6f2e9"/>
  <text x="14" y="20" font-size="8" fill="#8a8073">THE SAME PERSON, TWO LEDGERS</text>

  <text x="14" y="46" font-size="8.5" fill="#8a3324">COSTS</text>
  <rect x="14" y="52" width="120" height="18" fill="#8a3324"/>
  <text x="140" y="65" font-size="8" fill="#8a3324">counties, immediately</text>

  <text x="14" y="94" font-size="8.5" fill="#2f5670">REVENUE</text>
  <rect x="14" y="100" width="292" height="18" fill="#2f5670"/>
  <text x="300" y="113" font-size="8" fill="#f6f2e9" text-anchor="end">federal, over decades</text>

  <line x1="14" y1="136" x2="306" y2="136" stroke="#ddd3c2" stroke-width="0.8"/>

  <text x="160" y="160" font-size="15" fill="#211d18" text-anchor="middle" font-weight="600">Both are right.</text>
  <text x="160" y="177" font-size="8" fill="#8a8073" text-anchor="middle">A county and the CBO see one person</text>
  <text x="160" y="190" font-size="8" fill="#7a5a18" text-anchor="middle">and reach opposite conclusions</text>
</svg>
